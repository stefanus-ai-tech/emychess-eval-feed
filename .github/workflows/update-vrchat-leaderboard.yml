name: Update VRChat leaderboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-vrchat-leaderboard.yml
      - leaderboard-proxy/**
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: update-vrchat-leaderboard
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out generator
        uses: actions/checkout@v4

      - name: Check out existing Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site

      - name: Build leaderboard bridge
        env:
          LEADERBOARD_API_URL: ${{ vars.LEADERBOARD_API_URL || 'https://chess.cvar1984.net/index.php?rankings=1' }}
        run: |
          python3 leaderboard-proxy/generate_leaderboard.py "$LEADERBOARD_API_URL" published-site/leaderboard/index.html

      - name: Publish leaderboard without replacing the eval feed
        working-directory: published-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard/index.html
          if git diff --cached --quiet; then
            echo "Leaderboard is unchanged"
            exit 0
          fi
          git commit -m "Update VRChat leaderboard"
          git pull --rebase origin gh-pages
          git push origin gh-pages
